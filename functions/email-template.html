<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Contact Form Submission</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f4f4; }
        
        @media screen and (max-width: 600px) {
            .mobile-hide { display: none !important; }
            .mobile-center { text-align: center !important; }
            .content-container { padding: 20px !important; }
            .main-container { width: 100% !important; }
        }
    </style>
</head>
<body style="margin: 0 !important; padding: 0 !important; background-color: #f4f4f4;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="background-color: #f4f4f4;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;" class="main-container">
                    <tr>
                        <td align="center" style="padding: 40px; background-color: #ffffff;" class="content-container">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="font-family: 'Georgia', 'Times New Roman', serif; font-size: 24px; font-weight: bold; color: #333333; line-height: 1.2;">
                                        New Contact Form Submission
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 20px 0;"></td>
                                </tr>
                                <tr>
                                    <td align="left" style="font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; font-size: 16px; color: #555555; line-height: 1.6;">
                                        <p><strong>From:</strong> {{name}}</p>
                                        <p><strong>Email:</strong> {{email}}</p>
                                        <p><strong>Message:</strong></p>
                                        <p>{{message}}</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 30px; background-color: #333333; color: #bbbbbb; font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif; font-size: 12px;">
                            Portfolio Contact Form © 2025<br>
                            Automated email notification
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
